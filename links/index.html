    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: #071528;
            overflow-x: hidden;
        }

        /* Fondo animado con múltiples colores */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 8s ease-in-out infinite;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: #17A058;
            top: -100px;
            right: -80px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 250px;
            height: 250px;
            background: #0D2242;
            bottom: 20%;
            left: -60px;
            animation-delay: 2s;
        }

        .blob-3 {
            width: 200px;
            height: 200px;
            background: #17A058;
            bottom: -50px;
            right: 20%;
            opacity: 0.4;
            animation-delay: 4s;
        }

        .blob-4 {
            width: 150px;
            height: 150px;
            background: #3b82f6;
            top: 40%;
            left: 50%;
            opacity: 0.3;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 3px rgba(23, 160, 88, 0.4), 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(23, 160, 88, 0.3), 0 12px 40px rgba(0, 0, 0, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(23, 160, 88, 0.15), 0 12px 40px rgba(0, 0, 0, 0.4); }
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .name {
            color: white;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 36px;
            font-weight: 400;
        }

        .tagline span {
            color: #17A058;
            font-weight: 600;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 18px;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.25s ease;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            border-radius: 3px 0 0 3px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .link:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .link:hover::before {
            opacity: 1;
        }

        .link:active {
            transform: translateY(0);
        }

        .link-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .link-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .link-text {
            flex: 1;
            text-align: left;
        }

        .link-text small {
            display: block;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
            font-weight: 400;
            margin-top: 2px;
        }

        .link-arrow {
            color: rgba(255, 255, 255, 0.2);
            font-size: 20px;
            transition: transform 0.25s ease;
        }

        .link:hover .link-arrow {
            transform: translateX(4px);
            color: rgba(255, 255, 255, 0.5);
        }

        /* Colores por red social */

        .whatsapp:hover { border-color: rgba(37, 211, 102, 0.3); }

        .web .link-icon { background: linear-gradient(135deg, #17A058, #0D2242); }

        .web:hover { border-color: rgba(23, 160, 88, 0.3); }

        .instagram::before { background: linear-gradient(45deg, #f09433, #dc2743); }
        .instagram:hover { border-color: rgba(220, 39, 67, 0.3); }

        .youtube .link-icon { background: #FF0000; }
        .youtube::before { background: #FF0000; }
        .youtube:hover { border-color: rgba(255, 0, 0, 0.3); }

        .facebook .link-icon { background: #1877F2; }

        .facebook:hover { border-color: rgba(24, 119, 242, 0.3); }

            color: #17A058;
            text-decoration: none;

        @media (max-width: 480px) {

                width: 20px;
                height: 20px;
            }
        }
